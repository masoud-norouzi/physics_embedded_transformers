experiment:
  id: physics_markovian_v1_decision_conditioned
  description: >
    Phase 2/3: same joint from-scratch recipe as physics_markovian_v1_decision_joint.yml
    (rollout-horizon curriculum, decision_stop_gradient=true protecting the trunk from the
    decision head's own BCE loss), plus model.architecture.condition_velocity_on_decision=true --
    velocity_head now reads concat([h_last, decision_prob]), gated to the pre-junction window via
    live occupancy features (Axis 2/4), with decision_prob itself scheduled between the true
    branch label and the model's own self-prediction using the same p_truth anneal as
    scheduled_sampling (Axis 3). decision_stop_gradient still isolates the TRUNK from any
    decision-related gradient (whether from decision_loss or from motion loss flowing back through
    decision_head via the new conditioning path) -- see the Phase 2/3 design note in memory /
    docs/models/physics_markovian.tex for the four-axis design and the
    decision_confidence_crossing_gap validation metric this run should be watched against before
    considering the self-fulfilling-prophecy risk closed.

dataset:
  path: outputs/processed/2/canonical_dataset_v2/canonical_dataset_v2.npz
  stride: 5

model:
  type: markovian
  input_dim: 16
  target_features:
    - vx
    - vy
    - bbox_w
    - bbox_h
  input_feature_names:
    - x
    - y
    - vx
    - vy
    - bbox_w
    - bbox_h
    - cfd_u_norm
    - cfd_v_norm
    - superficial_velocity
    - left_flow_fraction
    - occupancy_inlet_channel
    - occupancy_inlet_junction
    - occupancy_left_branch
    - occupancy_right_branch
    - occupancy_outlet_junction
    - occupancy_outlet_channel
  T_history: 1
  rollout_horizon: 50
  max_droplets: 64
  architecture:
    d_model: 128
    n_heads: 4
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    predict_branch_decision: true
    decision_stop_gradient: true  # trunk still isolated from all decision-related gradient
    condition_velocity_on_decision: true  # Axis 1: velocity_head input = concat([h_last, decision_prob])

training:
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 160
  random_seed: 123
  num_workers: 0
  loss_alpha: 2.0
  rollout_horizon_schedule:
    - start_epoch: 1
      horizon: 5
    - start_epoch: 21
      horizon: 10
    - start_epoch: 41
      horizon: 15
    - start_epoch: 61
      horizon: 20
    - start_epoch: 81
      horizon: 25
    - start_epoch: 101
      horizon: 30
    - start_epoch: 121
      horizon: 35
    - start_epoch: 131
      horizon: 40
    - start_epoch: 141
      horizon: 45
    - start_epoch: 151
      horizon: 50
  log_every_n_batches: 25
  output_dir: outputs/models/physics_markovian_v1_decision_conditioned
  physics_refresh:
    runtime_start_epoch: 2
  geometry_constraint:
    enabled: true
    weight: 5.0
    tolerance: 0.005
    num_samples_x: 48
    num_samples_y: 48
  hard_wall_containment:
    enabled: true
  event_exclusion:
    enabled: true
    split_events_csv: outputs/evaluation/split_event_scan/split_child_track_events.csv
    parent_pre_frames: 10
    parent_post_frames: 25
    nearby_radius_px: 70.0
  stage_handoff:
    enabled: true
    metric: active_horizon_position_rmse
  scheduled_sampling:
    # Also drives Axis 3's decision-conditioning anneal (sample_decision_conditioning_signal) --
    # one shared p_truth schedule for both position/velocity self-conditioning and decision
    # self-conditioning, per the Phase 1 requirement that they stay in lockstep.
    enabled: true
    schedule:
      - start_epoch: 1
        p_truth: 1.0
      - start_epoch: 20
        p_truth: 0.5
      - start_epoch: 60
        p_truth: 0.2
      - start_epoch: 120
        p_truth: 0.05
  decision_head:
    enabled: true
    loss_weight: 1.0
    labels_path: outputs/processed/2/canonical_dataset_v2/branch_decision_labels.npz
    calibration_every_n_epochs: 5

device:
  mode: auto

smoke_test:
  train_windows: 8
  val_windows: 4
  batch_size: 2
  epochs: 1
  optimization_steps: 2
  rollout_horizon: 3
