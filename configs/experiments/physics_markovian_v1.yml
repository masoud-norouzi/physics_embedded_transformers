experiment:
  id: physics_markovian_v1
  description: Physics-enabled Markovian rollout Transformer using canonical_dataset_v2

dataset:
  path: outputs/processed/2/canonical_dataset_v2/canonical_dataset_v2.npz
  stride: 5

model:
  type: markovian
  input_dim: 16
  target_features:
    - vx
    - vy
    - bbox_w
    - bbox_h
  input_feature_names:
    - x
    - y
    - vx
    - vy
    - bbox_w
    - bbox_h
    - cfd_u_norm
    - cfd_v_norm
    - superficial_velocity
    - left_flow_fraction
    - occupancy_inlet_channel
    - occupancy_inlet_junction
    - occupancy_left_branch
    - occupancy_right_branch
    - occupancy_outlet_junction
    - occupancy_outlet_channel
  T_history: 1
  rollout_horizon: 50
  max_droplets: 64
  architecture:
    d_model: 128
    n_heads: 4
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1

training:
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 200
  random_seed: 123
  num_workers: 0
  loss_alpha: 2.0
  rollout_horizon_schedule:
    - start_epoch: 1
      horizon: 5
    - start_epoch: 21
      horizon: 10
    - start_epoch: 41
      horizon: 15
    - start_epoch: 61
      horizon: 20
    - start_epoch: 81
      horizon: 25
    - start_epoch: 101
      horizon: 30
    - start_epoch: 121
      horizon: 35
    - start_epoch: 141
      horizon: 40
    - start_epoch: 161
      horizon: 45
    - start_epoch: 181
      horizon: 50
  log_every_n_batches: 25
  output_dir: outputs/models/physics_markovian_v1
  physics_refresh:
    runtime_start_epoch: 2
  geometry_constraint:
    enabled: true
    weight: 5.0
    tolerance: 0.005
    num_samples_x: 48
    num_samples_y: 48
  event_exclusion:
    enabled: true
    split_events_csv: outputs/evaluation/split_event_scan/split_child_track_events.csv
    parent_pre_frames: 10
    parent_post_frames: 25
    nearby_radius_px: 70.0
  stage_handoff:
    enabled: true
    metric: active_horizon_position_rmse
  adaptive_target_fusion:
    enabled: false
    mode: causal_rollout
    ema_beta: 0.95
    initial_prediction_variance: 1.0
    detection_position_variance_px2: 0.2
    min_alpha: 0.0
    max_alpha: 0.8

device:
  mode: auto

smoke_test:
  train_windows: 8
  val_windows: 4
  batch_size: 2
  epochs: 1
  optimization_steps: 2
  rollout_horizon: 3
