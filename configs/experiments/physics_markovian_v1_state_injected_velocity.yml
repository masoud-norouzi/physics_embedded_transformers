experiment:
  id: physics_markovian_v1_state_injected_velocity
  description: >
    Diagnostic-only training track, not a deployment candidate. Replaces the earlier (now removed)
    fully-teacher-forced track: that version injected true vx,vy every step too, which made the
    "prediction" trivially copyable from context. This version keeps position/context grounded in
    reality but always makes the model commit to its own velocity belief:

    1. training.state_injected_rollout.enabled=true: vx, vy are always the model's OWN prediction
       (for a droplet already present last step, never injected from truth after the very first
       step), and x, y are integrated from that same prediction via a simple Euler step
       (build_stale_refresh_frame) -- neither is ever taken from ground truth, so neither can be
       trivially copied from context. Every OTHER feature (CFD, occupancy, superficial_velocity,
       left_flow_fraction) IS still always the raw ground-truth row (get_true_future_features),
       refreshed every step regardless of what the model predicted -- occupancy in particular is
       still a real leakage risk for the decision head (it's position-derived and always reflects
       the droplet's TRUE region, even though position itself is now only integrated/predicted;
       worth checking the frames-until-commit calibration plot with that in mind, not just the
       aggregate accuracy_near_commitment number). A droplet newly entering the window has no
       prior own-prediction to reuse (and injecting its true vx,vy would leak ground truth through
       that one remaining gap), so it's seeded from a precomputed typical_inlet_velocity instead
       (mean vx,vy observed in the inlet channel/junction regions -- droplets there haven't yet
       diverged toward a branch and move at fairly uniform speed); its position at entry is still
       taken from truth, same as every other rollout mode does for a droplet it's never seen
       before. No geometry_constraint (it regularizes a PREDICTED bbox against overlap; bbox is
       never predicted here, so there's nothing for it to check). hard_wall_containment IS enabled
       -- its ellipse-aware clamp normally needs a predicted bbox (dims 2:4 of the model's raw
       target), which this config doesn't have, but build_stale_refresh_frame's new
       clamp_bbox_phys param lets the clamp use the droplet's REAL (ground-truth) bbox instead, so
       the integrated position still gets a genuine wall-containment safety net without the model
       ever needing to see or predict bbox. No stage_handoff/rollout_horizon_schedule -- position and velocity now both genuinely
       compound step to step, and the point of this config is to observe that directly rather than
       curriculum it away, at least for a first look. scheduled_sampling is left disabled
       (p_truth=None throughout) so the decision-conditioning signal also always falls back to the
       model's own decision belief, matching "always own prediction" everywhere, not just velocity.
       loss_alpha=0.0 (uniform step weighting) is deliberate for the same reason -- no discounting
       away the compounding this config exists to reveal.

    2. model.input_feature_names drops bbox_w/bbox_h (16 -> 14 features, input_dim=14). bbox is not
       fed to the model at all in this config -- validate_feature_contract allows input_feature_names
       to be an ordered subset of the dataset's full feature set specifically under
       state_injected_rollout; the sliced-out columns are still available internally (for ground-
       truth injection bookkeeping) via the dataset's own full-width Z array, they're just never
       part of what reaches the transformer. bbox is not a training target either (target_features
       is [vx, vy] only, as it already was for the removed teacher-forced track), so
       bbox_stop_gradient is off (nothing to isolate).

    3. training.neighbor_key_dropout stays enabled (kept from the removed track, unchanged): each
       present droplet independently has a 20% chance, drawn once per training window and held
       constant across that window, of being hidden as an attention KEY -- still a full query,
       still supervised normally, just invisible to other droplets' attention.

    Trained from scratch (not warm-started) and never meant for closed-loop deployment -- it has
    never been trained to correct its own compounding error via real physics/integration.

dataset:
  path: outputs/processed/2/canonical_dataset_v2/canonical_dataset_v2.npz
  stride: 5

model:
  type: markovian
  input_dim: 14
  target_features:
    - vx
    - vy
  input_feature_names:
    - x
    - y
    - vx
    - vy
    # bbox_w/bbox_h deliberately dropped -- see experiment.description item 2.
    - cfd_u_norm
    - cfd_v_norm
    - superficial_velocity
    - left_flow_fraction
    - occupancy_inlet_channel
    - occupancy_inlet_junction
    - occupancy_left_branch
    - occupancy_right_branch
    - occupancy_outlet_junction
    - occupancy_outlet_channel
  T_history: 1
  rollout_horizon: 50
  max_droplets: 64
  architecture:
    d_model: 128
    n_heads: 4
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    predict_branch_decision: true
    decision_stop_gradient: true  # trunk still isolated from all decision-related gradient
    condition_velocity_on_decision: true  # Axis 1: motion_head input = concat([h_last, decision_prob])
    bbox_stop_gradient: false  # N/A -- requires target_dim > 2, and bbox isn't a target at all in this config

training:
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 160
  random_seed: 123
  num_workers: 0
  loss_alpha: 0.0  # uniform step weighting -- see experiment.description item 1
  log_every_n_batches: 25
  output_dir: outputs/models/physics_markovian_v1_state_injected_velocity
  state_injected_rollout:
    enabled: true
  hard_wall_containment:
    enabled: true  # clamp uses the droplet's REAL bbox (see experiment.description item 1) -- the model never sees or predicts it
  neighbor_key_dropout:
    enabled: true
    probability: 0.2
  event_exclusion:
    enabled: true
    split_events_csv: outputs/evaluation/split_event_scan/split_child_track_events.csv
    parent_pre_frames: 10
    parent_post_frames: 25
    nearby_radius_px: 70.0
  decision_head:
    enabled: true
    loss_weight: 1.0
    labels_path: outputs/processed/2/canonical_dataset_v2/branch_decision_labels_max20.npz
    calibration_every_n_epochs: 5

device:
  mode: auto

smoke_test:
  train_windows: 8
  val_windows: 4
  batch_size: 2
  epochs: 1
  optimization_steps: 2
  rollout_horizon: 3
